item=u-boot,                 u-boot.fex
; Keep OP-TEE loaded because the Linux DT uses its PSCI/SMC implementation.
; The overlay supplies a non-secure-board-compatible OP-TEE binary which does
; not panic when a factory-erased board has no provisioned HUK.
